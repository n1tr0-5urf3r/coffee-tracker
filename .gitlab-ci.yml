# Avoid duplicate pipelines: while a branch has an open MR, only the MR pipeline runs
# (otherwise every push to an MR branch, e.g. by Renovate, ran verify twice).
# Pushes to the default branch still run the normal branch pipeline incl. docker_publish.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - verify
  - deploy
  - sync

variables:
  CARGO_TERM_COLOR: always
  # Keep cargo's download cache inside the project dir so GitLab can cache it
  # (paths outside CI_PROJECT_DIR are silently ignored by `cache:`).
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  # Incremental artifacts are useless in CI and were most of target/debug.
  CARGO_INCREMENTAL: "0"
  # Max size of backend/target before it is dropped instead of cached.
  CARGO_TARGET_MAX_MB: "6000"
  # One shared cache per job, written only by the default branch; MR/Renovate
  # branches just read it. Per-branch keys left a multi-GB cache per branch.
  CACHE_POLICY: pull
  DOCKERHUB_BACKEND_IMAGE: unituekn/coffee-tracker-backend
  DOCKERHUB_FRONTEND_IMAGE: unituekn/coffee-tracker-frontend

backend_verify:
  stage: verify
  image: rust:1.100.0-trixie
  cache:
    key: cargo-${CI_DEFAULT_BRANCH}
    unprotect: true
    policy: $CACHE_POLICY
    paths:
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      - backend/target
  before_script:
    - cd backend
  script:
    - cargo test
    - cargo build --release
    # The committed OpenAPI spec must match the code (fix: scripts/regen-openapi.sh)
    - cargo run --release --locked --quiet --bin openapi-export > /tmp/openapi.json
    - diff -u ../frontend/coffee-tracker/fixtures/openapi.json /tmp/openapi.json
  after_script:
    # Dependency bumps keep adding artifacts to target/; drop it once it gets
    # too big so the next default-branch run caches a fresh one.
    - |
      if [ -d backend/target ] && [ "$(du -sm backend/target | cut -f1)" -gt "${CARGO_TARGET_MAX_MB}" ]; then
        echo "backend/target exceeds ${CARGO_TARGET_MAX_MB} MB, not caching it"; rm -rf backend/target
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        CACHE_POLICY: pull-push
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  tags: [remote]

frontend_verify:
  stage: verify
  image: node:26-trixie
  cache:
    key: npm-${CI_DEFAULT_BRANCH}
    unprotect: true
    policy: $CACHE_POLICY
    paths:
      - .npm
  before_script:
    - cd frontend/coffee-tracker
    # node_modules is wiped by `npm ci` anyway; cache npm's download cache instead
    - npm ci --cache "${CI_PROJECT_DIR}/.npm" --prefer-offline
  script:
    - npm run lint
    - npm run test
    - npm run build
    # schema.ts must match fixtures/openapi.json (fix: scripts/regen-openapi.sh --frontend-only)
    - cp src/api/schema.ts /tmp/schema.ts && npm run generate:api && diff -u /tmp/schema.ts src/api/schema.ts
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        CACHE_POLICY: pull-push
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  tags: [remote]

backend_docker_publish:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - export IMAGE_LATEST="docker.io/${DOCKERHUB_BACKEND_IMAGE}:latest"
    - export IMAGE_SHA="docker.io/${DOCKERHUB_BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"unituekn\",\"password\":\"${DOCKERHUB_TOKEN}\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
      --destination "${IMAGE_LATEST}"
      --destination "${IMAGE_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  tags: [remote]

frontend_docker_publish:
  stage: deploy
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - export IMAGE_LATEST="docker.io/${DOCKERHUB_FRONTEND_IMAGE}:latest"
    - export IMAGE_SHA="docker.io/${DOCKERHUB_FRONTEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - mkdir -p /kaniko/.docker
    - |
      echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"unituekn\",\"password\":\"${DOCKERHUB_TOKEN}\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/frontend/coffee-tracker"
      --dockerfile "${CI_PROJECT_DIR}/frontend/coffee-tracker/Dockerfile"
      --destination "${IMAGE_LATEST}"
      --destination "${IMAGE_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  tags: [remote]

github_sync:
  stage: sync
  image:
    name: alpine/git:v2.54.1
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  script:
    - git remote add github "https://x-access-token:${GITHUB_PUSH_TOKEN}@github.com/n1tr0-5urf3r/coffee-tracker.git"
    - |
      export GIT_AUTHOR_NAME="GitLab CI"
      export GIT_AUTHOR_EMAIL="gitlab-ci@users.noreply.github.com"
      export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
      export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"
      TREE="$(git write-tree)"
      if git fetch github "${CI_DEFAULT_BRANCH}"; then
        PARENT="$(git rev-parse FETCH_HEAD)"
        SYNC_COMMIT="$(printf 'Sync from GitLab pipeline %s\n' "${CI_PIPELINE_ID}" | git commit-tree "${TREE}" -p "${PARENT}")"
      else
        SYNC_COMMIT="$(printf 'Initial public snapshot\n' | git commit-tree "${TREE}")"
      fi
      git push github "${SYNC_COMMIT}:refs/heads/${CI_DEFAULT_BRANCH}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: github-sync
  tags: [remote]
