[package]
name = "coffee-tracker"
version = "1.7.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/n1tr0-5urf3r/coffee-tracker"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
image = "0.25.10"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "pool", "ring", "smtp-transport", "tokio1-rustls", "webpki-roots"] }
qrcode = "0.14.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "rt-multi-thread", "signal", "time"] }
tower-cookies = "0.11.0"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
